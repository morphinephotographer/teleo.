name: Mac app (desktop shell)

on:
  push:
    branches: [claude/mac-desktop-app]
    paths: ["apps/desktop/**", ".github/workflows/mac-desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app and DMG
        run: |
          swift --version
          set -o pipefail
          bash apps/desktop/build.sh 2>&1 | tee build.log
      - name: Smoke test (launch for 8 s)
        run: |
          set -o pipefail
          APP="apps/desktop/dist/teleo..app"
          "$APP/Contents/MacOS/teleo" > smoke.log 2>&1 & PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then echo "running ok" | tee -a smoke.log; kill $PID; else echo "app exited early" | tee -a smoke.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: teleo-mac
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
      - name: Publish DMG to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="mac-v$VERSION"
          DMG="apps/desktop/dist/teleo-$VERSION.dmg"
          NOTES="Нативное приложение teleo. для Mac (Apple Silicon + Intel). Скачай teleo-$VERSION.dmg, открой и перетащи teleo. в «Программы». Первый запуск: правый клик по значку → «Открыть» → «Открыть»."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" "$DMG" --target "$GITHUB_SHA" --title "teleo. для Mac $VERSION" --notes "$NOTES" --latest
          fi
          gh release view "$TAG" --json url,assets --jq '.url, .assets[].name' | tee release.txt
      - name: Publish build (or logs) to branch mac-desktop-builds
        if: always()
        run: |
          mkdir /tmp/pub && cp apps/desktop/dist/*.dmg build.log smoke.log release.txt /tmp/pub/ 2>/dev/null || true
          echo "${{ job.status }}" > /tmp/pub/STATUS
          git config user.name "teleo build bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan mac-desktop-builds
          git rm -rf --cached . >/dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/pub/* .
          git add -A
          git commit -m "teleo. Mac build ${GITHUB_SHA::7}"
          git push -f origin mac-desktop-builds
