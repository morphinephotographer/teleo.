name: Mac app (desktop shell)

on:
  push:
    branches: [main]
    paths: ["apps/desktop/**", ".github/workflows/mac-desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app and DMG
        run: |
          swift --version
          set -o pipefail
          bash apps/desktop/build.sh 2>&1 | tee build.log
      - name: Smoke test (launch for 8 s)
        run: |
          set -o pipefail
          APP="apps/desktop/dist/teleo..app"
          "$APP/Contents/MacOS/teleo" > smoke.log 2>&1 & PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then echo "running ok" | tee -a smoke.log; kill $PID; else echo "app exited early" | tee -a smoke.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: teleo-mac
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
      - name: Publish DMG to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="mac-v$VERSION"
          DMG="apps/desktop/dist/teleo-$VERSION.dmg"
          NOTES="teleo. for Mac (Apple silicon + Intel). Download teleo-$VERSION.dmg, open it and drag teleo. to Applications. First launch: right-click the app → Open → Open (the app is not notarized)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" "$DMG" --target "$GITHUB_SHA" --title "teleo. for Mac $VERSION" --notes "$NOTES" --latest
          fi
          gh release view "$TAG" --json url,assets --jq '.url, .assets[].name'
